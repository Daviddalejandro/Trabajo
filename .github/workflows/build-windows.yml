name: Build Windows .exe

on:
  push:
    branches:
      - "claude/**"
      - main
    paths:
      - "src/**"
      - "catalogs/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

# Silencia el warning de deprecacion de Node.js 20 en las actions oficiales.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Show installed packages
        shell: pwsh
        run: pip list

      - name: Run tests (sanity)
        shell: pwsh
        run: |
          pip install pytest
          $env:QT_QPA_PLATFORM = "offscreen"
          pytest tests/ -q

      - name: Build standalone .exe with PyInstaller
        shell: pwsh
        run: |
          pyinstaller packaging/BPMNPlatform.spec --noconfirm --clean

      - name: Smoke test the binary
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist/BPMNPlatform.exe")) {
            Write-Error "Binario no generado en dist/"
            exit 1
          }
          $size = (Get-Item "dist/BPMNPlatform.exe").Length / 1MB
          Write-Host ("Binario generado: {0:N1} MB" -f $size)

      - name: Upload .exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPMNPlatform-windows-${{ github.sha }}
          path: dist/BPMNPlatform.exe
          retention-days: 30
          if-no-files-found: error
